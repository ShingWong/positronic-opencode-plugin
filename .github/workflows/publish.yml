name: publish

# Tags only. A push to a branch must not reach this file, and the trigger is the
# only thing standing between an ordinary main push and a release, so it stays
# narrow: no branches, no workflow_dispatch.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create needs a writable token
      id-token: write   # REQUIRED: the OIDC token npm exchanges for publish auth
    steps:
      - uses: actions/checkout@v4

      # npm's own docs for trusted publishing warn against caching in a release
      # build: the runner must not resolve from a poisoned cache when the whole
      # point of this file is that the artefact is attributable.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # NO registry-url: it writes //registry.npmjs.org/:_authToken into
          # .npmrc, and npm sends that token instead of doing the OIDC
          # exchange — v0.1.2 signed its provenance fine and then died with
          # E401 "authentication token seems to be invalid". Trusted publishing
          # authenticates through id-token, so npm must find no token at all.
          # (Also dropped package-manager-cache: not a setup-node@v4 input; the
          # dependency cache was never enabled anyway, since `cache` is unset.)

      # `npm trust` and `npm stage` are npm 11+ commands. Node 22 ships an
      # older bundled npm, so upgrade explicitly rather than depending on which
      # npm a given Node 22.x tarball happens to bundle. npm 12 needs Node
      # ^22.22.2, which is why node-version is left at 22 and the floor is
      # asserted immediately below rather than assumed.
      - run: npm install -g npm@12
      - name: Assert the staged-publish commands exist
        run: |
          set -euo pipefail
          # One physical line: a \ at end of line inside '...' is passed to
          # node verbatim (bash only joins \-newline outside quotes), which
          # made the old multi-line script die with "Expected unicode escape".
          node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (!(a>22 || (a===22 && b>=22))) { console.error("Node " + process.versions.node + " predates npm 12 (needs ^22.22.2)"); process.exit(1); }'
          npm stage --help >/dev/null 2>&1 || npm stage 2>&1 | grep -qi 'stage packages' \
            || { echo "::error::npm lacks 'stage' — trusted publishing cannot run"; exit 1; }
          echo "npm $(npm --version) on node $(node --version): stage publish available"

      # The vitest suites shell out to `python3 -m positronic_ai`, and the
      # python shim (src/config.py, src/brains.py) is exercised by pytest, so
      # the runner needs Python plus positronic_ai. This mirrors ci.yml: a
      # release that cannot reproduce the test signal is not a release.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/checkout@v4
        with:
          repository: ShingWong/positronic-agent-interface
          path: positronic-agent-interface
      - run: npm ci
      - run: npm run build
      - run: python -m pip install --upgrade pip pytest
      - run: pip install ./positronic-agent-interface
      - run: npx vitest run

      # ref_name is the pushed tag, because the trigger only fires on tags.
      # Idempotent: re-running a tag after moving it must not fail on
      # "release already exists".
      - name: Create GitHub release
        run: |
          set -euo pipefail
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists — updating notes"
            gh release edit "${{ github.ref_name }}" --generate-notes
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trusted publishing: no NPM_TOKEN, no NODE_AUTH_TOKEN, no 2FA prompt. CI
      # presents the OIDC token minted above, npm exchanges it for short-lived
      # publish credentials, and the secret store is not involved at all.
      #
      # `npm stage publish` rather than `npm publish` so that proof-of-presence
      # (2FA) is deferred to a human `npm stage approve <stage-id>` run later.
      # That keeps the phone approval off the critical path of a tag push while
      # still requiring it before anything reaches the registry. `--provenance`
      # links the tarball to this workflow run; it is free under OIDC and is the
      # point of doing trusted publishing rather than just deleting a secret.
      #
      # To enable, the operator runs once, authenticated with 2FA:
      #   npm trust github @positronic-ai/opencode-plugin \
      #     --file publish.yml \
      #     --repo ShingWong/positronic-opencode-plugin \
      #     --allow-publish --allow-stage-publish
      # Note the split: --file and --repo name the WORKFLOW, the positional
      # argument names the npm PACKAGE. They are not the same string.
      - name: Stage publish to npm
        run: >-
          npm stage publish --provenance --access public
          --tag ${{ contains(github.ref_name, 'beta') && 'beta' || 'latest' }}
