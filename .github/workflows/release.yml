name: release
on: { push: { tags: ["v*"] } }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }   # gh release create needs a writable token
    steps:
      - uses: actions/checkout@v4
      # registry-url makes setup-node write the .npmrc entry that npm needs,
      # so publishing authenticates via NODE_AUTH_TOKEN rather than failing ENEEDAUTH.
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci && npm run build && npx vitest run
      - run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Gate on the secrets context: a step's own env block is not in scope for
      # that same step's if, so env.NPM_TOKEN here always read as empty and the
      # publish step was silently skipped on every tagged release.
      - run: npm publish --tag ${{ contains(github.ref_name,'beta') && 'beta' || 'latest' }}
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
