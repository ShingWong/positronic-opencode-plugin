name: release

# Tags only. A push to a branch must not reach this file, and the trigger is the
# only thing standing between an ordinary main push and a release, so it stays
# narrow: no branches, no workflow_dispatch.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    # gh release create needs a writable token.
    permissions: { contents: write }
    # The secret is read into job-level env, not a step env block. The `secrets`
    # context is NOT available in a step-level `if` (only github/needs/strategy/
    # matrix/job/runner/env/vars/steps/inputs are), and a step's own env block is
    # not in scope for that same step's `if` either -- so gating on either one is
    # a workflow *validation* error that fails every run before a single step
    # executes. Job-level env is the only place where both `secrets` and a
    # downstream step `if` can see the value.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # registry-url makes setup-node write the .npmrc entry that npm needs,
      # so publishing authenticates via NODE_AUTH_TOKEN rather than failing ENEEDAUTH.
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }

      # The vitest suites shell out to `python3 -m positronic_ai`, and the
      # python shim (src/config.py, src/brains.py) is exercised by pytest, so
      # the runner needs Python plus positronic_ai. This mirrors ci.yml: a
      # release that cannot reproduce the test signal is not a release.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/checkout@v4
        with:
          repository: ShingWong/positronic-agent-interface
          path: positronic-agent-interface
      - run: npm ci
      - run: npm run build
      - run: python -m pip install --upgrade pip pytest
      - run: pip install ./positronic-agent-interface
      - run: npx vitest run

      # ref_name is the pushed tag, because the trigger only fires on tags.
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate on env.NPM_TOKEN, which the job-level env above populates. npm
      # removes bypass-2FA token publishing in January 2027; trusted publishing
      # (OIDC) is the eventual replacement, but that migration is deliberately
      # NOT part of this change.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --tag ${{ contains(github.ref_name,'beta') && 'beta' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
